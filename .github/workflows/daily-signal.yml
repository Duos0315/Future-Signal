name: Generate daily signal and verify core

on:
  push:
    paths:
      - "app.js"
      - "index.html"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/daily-signal.yml"
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-signal
  cancel-in-progress: false

jobs:
  verify-and-generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check scripts/generate.mjs
          node --check scripts/lib/network.mjs
          node --check scripts/lib/labs.mjs
      - name: Run automated regression tests
        run: npm test
      - name: Generate and validate today's signal
        run: |
          npm run generate
          node --input-type=module -e "import fs from 'node:fs'; const s=JSON.parse(fs.readFileSync('data/daily.json','utf8')); if (!s.id || !s.title || !s.experiment || !s.question || !s.caveat || !Array.isArray(s.lenses) || s.lenses.length !== 3 || s.status !== 'hypothesis-prompt' || !Array.isArray(s.variables) || s.variables.length < 3) process.exit(1); const a=JSON.parse(fs.readFileSync('data/archive/index.json','utf8')); if (!a.items.some(x => x.id === s.id && x.experiment && x.caveat)) process.exit(1); console.log('Signal and archive validation passed:', s.id)"
      - name: Commit daily signal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily.json data/archive/index.json
          if git diff --cached --quiet; then
            echo "No signal changes to publish."
            exit 0
          fi
          git commit -m "chore: publish daily signal $(date -u +%F)"
          # A code commit may land while this scheduled job is running.
          # Rebase the generated data commit onto the newest main before pushing.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying after refreshing main."
          done
          echo "Could not publish after three attempts."
          exit 1
